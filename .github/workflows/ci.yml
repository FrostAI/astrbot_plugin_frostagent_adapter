name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests (websockets ${{ matrix.websockets }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        websockets: ['12.0', '15.0.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create test environment
        run: python3 -m venv "$RUNNER_TEMP/adapter-tests"
      - name: Install dependencies
        run: '"$RUNNER_TEMP/adapter-tests/bin/python" -m pip install -r requirements.txt "websockets==${{ matrix.websockets }}"'
      - name: Run unit and WebSocket transport tests
        run: '"$RUNNER_TEMP/adapter-tests/bin/python" -m unittest discover -s . -p "test_*.py" -v'
